<style>
	chat-input {
		padding: 4px;
		margin: 0 12px 12px 12px;
		border: solid 1px var(--vscode-input-border);
		border-radius: 4px;
		background: var(--vscode-input-bg);
		display: flex;
		flex-direction: column;
		align-items: flex-start;
		gap: 8px;
		/* Make this flex item sit at bottom of container */
		margin-top: auto;

		context-bar {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 4px;
			width: 100%;

			add-context-button {
				border: solid 1px var(--vscode-chat-border);
				border-radius: 4px;
				padding: 2px;
				font-size: 12px;
				color: var(--vscode-foreground);
				display: flex;
				align-items: center;
				justify-content: center;
				background: transparent;
				user-select: none;
				cursor: default;

				&:hover {
					background: transparent;
				}
			}

			context-pill {
				display: flex;
				align-items: center;
				gap: 6px;
				color: var(--vscode-foreground-secondary);
				background: transparent;
				border: dashed 1px var(--vscode-chat-border);
				border-radius: 4px;
				padding: 1px 6px 1px 8px;
				font-size: 12px;
				user-select: none;
				cursor: default;

				&:hover {
					background: transparent;
				}

				&[state="suggestion"] {
					font-style: italic;
				}

				.filename {
					max-width: 100px;
					white-space: nowrap;
					overflow: hidden;
					text-overflow: ellipsis;
					vertical-align: middle;
				}

				.context-icon {
					display: flex;
					align-items: center;
					justify-content: center;
					--size: 12px;
					width: var(--size);
					height: var(--size);
					background: transparent;
				}
			}
		}

		textarea {
			width: 100%;
			resize: none;
			border: none;
			outline: none;
			background: transparent;
			color: var(--vscode-editor-fg);
			font-family: inherit;
			font-size: inherit;
			line-height: inherit;
			min-height: 20px;
			max-height: 120px;
			overflow-y: auto;

			&::placeholder {
				color: var(--vscode-foreground-secondary);
				font-size: 14px;
			}
		}

		static-text-area {
			width: 100%;
			resize: none;
			border: none;
			outline: none;
			background: transparent;
			color: var(--vscode-editor-fg);
			font-size: var(--font-size);
			min-height: 20px;
			max-height: 120px;
			overflow-y: auto;
			user-select: none;
		}

		static-text-area[placeholder] {
			color: var(--vscode-foreground-secondary);
		}

		chat-config-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			padding: 0;
			overflow-x: hidden;

			.chat-pickers {
				display: flex;
				align-items: center;
				gap: 4px;

				mode-picker,
				model-picker {
					display: flex;
					align-items: center;
					gap: 4px;
					font-size: 12px;
					background: transparent;
					border-radius: 5px;
					padding: 3px 2px 3px 6px;
					white-space: nowrap;
					cursor: default;

					&:hover {
						background: var(--vscode-icon-button-hover-bg);
					}
				}
			}

			.chat-actions {
				display: flex;
				align-items: center;
				gap: 2px;

				& > * {
					cursor: default;
					padding: 4px;
					border-radius: 4px;
				}

				& > *:hover {
					background: var(--vscode-icon-button-hover-bg);
				}
			}

			submit-remote,
			submit-local,
			tool-button {
				display: flex;
				align-items: center;
				justify-content: center;
			}
		}
	}
</style>
