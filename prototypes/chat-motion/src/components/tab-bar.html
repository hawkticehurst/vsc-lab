<style>
	tab-bar {
		display: flex;
		justify-content: flex-start;
		align-items: center;
		padding: 4px;
		gap: 2px;
		height: var(--vscode-tab-strip-height);
		border-bottom: solid 1px var(--vscode-border);
		width: 100%;
		min-width: 0;
		overflow-x: auto;
		scrollbar-width: none; /* Firefox */
		-ms-overflow-style: none; /* Internet Explorer 10+ */
		flex: 0 0 auto;
		user-select: none;

		&:has(tab-item:focus-visible) {
			outline: 2px solid var(--foreground-intense);
			outline-offset: 2px;
			z-index: 5;
		}

		tab-item {
			display: flex;
			align-items: center;
			gap: 4px;
			padding: 2px 5px;
			border-radius: 4px;
			border: solid 1px var(--vscode-border);
			color: var(--vscode-foreground-secondary);
			cursor: default;
			height: 100%;

			&:hover {
				background: var(--vscode-tab-hover-bg);
				color: var(--vscode-foreground);

				.close-icon svg {
					opacity: 1;
				}
			}

			&:focus-visible {
				outline: none;
				border: none;
			}

			&[active] {
				border: solid 1px var(--vscode-accent);
				background: var(--vscode-editor-bg);
				color: var(--vscode-foreground);
				font-weight: 500;

				.close-icon svg {
					opacity: 1;
					fill: var(--vscode-foreground);
				}
			}

			&[type="fill-end"] {
				flex: 1 1 auto;
				border-color: transparent;
				cursor: default;
				min-width: 0;
				padding: 0;
			}

			&[type="delegate-to-cloud-agent"] {
				.filename {
					font-weight: 500;
					display: flex;
					align-items: center;
					gap: 8px;

					svg {
						color: var(--vscode-foreground-secondary);
					}
				}
			}

			.filename {
				font-size: 14px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				width: max-content;
			}

			.close-icon {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 16px;
				height: 16px;
				cursor: default;

				svg {
					width: 16px;
					height: 16px;
					fill: var(--vscode-foreground-secondary);
					opacity: 0;
					transition: opacity 0.2s;
				}
			}
		}
	}
</style>
