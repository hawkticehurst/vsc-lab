<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>VS Code Lab</title>
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		:root {
			--gray-1: hsl(0 0% 8.5%);
			--gray-2: hsl(0 0% 11%);
			--gray-3: hsl(0 0% 13.6%);
			--gray-4: hsl(0 0% 15.8%);
			--gray-5: hsl(0 0% 17.9%);
			--gray-6: hsl(0 0% 20.5%);
			--gray-7: hsl(0 0% 24.3%);
			--gray-8: hsl(0 0% 31.2%);
			--gray-9: hsl(0 0% 43.9%);
			--gray-10: hsl(0 0% 49.4%);
			--gray-11: hsl(0 0% 62.8%);
			--gray-12: hsl(0 0% 93%);

			--accent-9: hsl(250 75% 60%);
			--accent-10: hsl(250 75% 65%);
			--accent-11: hsl(250 75% 75%);

			--radius-sm: 6px;
			--radius-md: 8px;
			--radius-lg: 12px;

			--shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
			--shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.3);
		}

		body {
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background-color: var(--gray-1);
			color: var(--gray-12);
			min-height: 100vh;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
		}

		.container {
			max-width: 720px;
			margin: 0 auto;
			padding: 64px 24px;
		}

		header {
			margin-bottom: 48px;
		}

		h1 {
			font-size: 2rem;
			font-weight: 600;
			letter-spacing: -0.02em;
			margin: 0 0 8px 0;
			color: var(--gray-12);
		}

		.subtitle {
			font-size: 1rem;
			color: var(--gray-11);
			margin: 0;
		}

		.demos-grid {
			display: grid;
			gap: 12px;
		}

		.section {
			margin-bottom: 48px;
		}

		.section:last-child {
			margin-bottom: 0;
		}

		.section-title {
			font-size: 1rem;
			font-weight: 600;
			color: var(--gray-11);
			margin: 0 0 16px 0;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.demo-link {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 10px 20px;
			background-color: var(--gray-2);
			border: 1px solid var(--gray-4);
			border-radius: var(--radius-md);
			text-decoration: none;
			color: var(--gray-12);
			transition: all 150ms ease;
		}

		.demo-link:hover {
			background-color: var(--gray-3);
			border-color: var(--gray-6);
			box-shadow: var(--shadow-sm);
		}

		.demo-link:focus-visible {
			outline: 2px solid var(--accent-9);
			outline-offset: 2px;
		}

		.demo-name {
			font-size: 0.9375rem;
			font-weight: 500;
		}

		.demo-arrow {
			color: var(--gray-9);
			transition: transform 150ms ease, color 150ms ease;
		}

		.demo-link:hover .demo-arrow {
			color: var(--gray-11);
			transform: translateX(2px);
		}

		.empty-state {
			text-align: center;
			padding: 48px 24px;
			color: var(--gray-10);
			background-color: var(--gray-2);
			border: 1px dashed var(--gray-6);
			border-radius: var(--radius-lg);
		}
	</style>
</head>

<body>
	<div class="container">
		<header>
			<h1>VS Code Lab</h1>
			<p class="subtitle">A place for prototyping new UX/UI for VS Code.</p>
		</header>
		<main>
			<section class="section">
				<h2 class="section-title">Demos</h2>
				<div class="demos-grid">
					<!-- DEMOS_LIST -->
				</div>
			</section>
			<section class="section">
				<h2 class="section-title">Tools</h2>
				<div class="demos-grid">
					<!-- TOOLS_LIST -->
				</div>
			</section>
		</main>
	</div>
</body>

</html>
