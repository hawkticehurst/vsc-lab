<style>
	top-bar {
		display: flex;
		justify-content: space-between;
		align-items: center;
		padding: 6px 8px;
		border: solid 1px var(--vscode-border);
		border-top-left-radius: 8px;
		border-top-right-radius: 8px;
		user-select: none;

		h1 {
			margin: 0;
			font-size: 14px;
			font-weight: 600;
			color: var(--vscode-foreground);
		}

		window-buttons {
			display: flex;
			gap: 6px;

			window-button {
				--size: 11px;
				width: var(--size);
				height: var(--size);
				border-radius: 50%;
				background: var(--vscode-border);

				&[type="close"] {
					background: #FF5F57;
				}
				&[type="minimize"] {
					background: #FFBD2E;
				}
				&[type="maximize"] {
					background: #28C840;
				}
			}
		}

		.top-bar-fullscreen-tabs {
			display: none;
			align-items: center;
			gap: 2px;
			margin-left: 12px;
		}

		fullscreen-tab {
			display: flex;
			align-items: center;
			gap: 4px;
			padding: 2px 5px;
			border-radius: 4px;
			border: solid 1px var(--vscode-border);
			color: var(--vscode-foreground-secondary);
			cursor: pointer;
			font-size: 14px;

			&:hover {
				background: var(--vscode-tab-hover-bg);
				color: var(--vscode-foreground);

				.close-icon svg {
					opacity: 1;
				}
			}

			&:focus-visible {
				outline: none;
				border-color: var(--vscode-accent);
			}

			&[active] {
				border: solid 1px var(--vscode-accent);
				background: var(--vscode-editor-bg);
				color: var(--vscode-foreground);
				font-weight: 500;

				.close-icon svg {
					opacity: 1;
					fill: var(--vscode-foreground);
				}
			}

			.tab-name {
				white-space: nowrap;
			}

			.close-icon {
				display: flex;
				align-items: center;
				justify-content: center;
