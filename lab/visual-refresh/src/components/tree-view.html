<style>
	tree-view {
		width: 100%;
		padding: 4px 0;
		color: var(--vscode-foreground-secondary);
		font-size: 13px;
		flex: 1 1 auto;
		min-height: 0;
		overflow: auto;
		user-select: none;

		tree-item {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 6px 16px;
			cursor: pointer;
			min-width: 0;
			overflow: hidden;
			border-radius: 0;
			margin: 0 8px;
			border-radius: var(--radius-sm);
			transition: all var(--transition-fast);

			&:hover {
				background: var(--vscode-tab-hover-bg);
				color: var(--vscode-foreground);
			}

			&[active] {
				background: var(--vscode-accent-subtle);
				color: var(--vscode-accent);
				font-weight: 500;

				& > .file-icon,
				& > .chevron-icon {
					fill: var(--vscode-accent);
				}
			}

			&[hidden] {
				display: none;
			}

			.folder-name,
			.file-name {
				flex: 1 1 auto;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				letter-spacing: 0.01em;
			}

			&[indent="1"] {
				padding-left: 28px;
			}
			&[indent="2"] {
				padding-left: 44px;
			}

			& > .file-icon {
				--size: 16px;
				width: var(--size);
				height: var(--size);
				fill: var(--vscode-foreground-secondary);
				flex-shrink: 0;
				opacity: 0.8;
				transition: opacity var(--transition-fast);
			}

			&:hover > .file-icon {
				opacity: 1;
			}
