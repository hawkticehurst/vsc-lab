<style>
	tab-bar {
		display: flex;
		justify-content: flex-start;
		align-items: center;
		padding: 6px 8px;
		gap: 4px;
		height: var(--vscode-tab-strip-height);
		border: solid 1px var(--vscode-border);
		border-radius: var(--radius-md);
		background: var(--vscode-bg);
		width: 100%;
		min-width: 0;
		overflow-x: auto;
		scrollbar-width: none; /* Firefox */
		-ms-overflow-style: none; /* Internet Explorer 10+ */
		flex: 0 0 auto;
		user-select: none;

		&:has(tab-item:focus-visible) {
			outline: 2px solid var(--vscode-accent);
			outline-offset: 2px;
			z-index: 5;
		}

		tab-item {
			display: flex;
			align-items: center;
			gap: 3px;
			padding: 6px 3px 6px 6px;
			border-radius: var(--radius-sm);
			background: transparent;
			border: 1px solid transparent;
			color: var(--vscode-foreground-secondary);
			cursor: default;
			height: 100%;
			transition: all var(--transition-fast);
			position: relative;

			&:hover {
				background: var(--vscode-tab-hover-bg);
				color: var(--vscode-foreground);

				.close-icon svg {
					opacity: 0.7;
				}
			}

			&:focus-visible {
				outline: none;
				box-shadow: 0 0 0 2px var(--vscode-accent-subtle);
			}

			&[active] {
				background: var(--vscode-accent-subtle);
				border-color: rgba(94, 184, 212, 0.2);
				color: var(--vscode-accent);
				font-weight: 500;

				.close-icon svg {
					opacity: 0.8;
					fill: var(--vscode-accent);
				}
			}

			&[type="fill-end"] {
				flex: 1 1 auto;
				border-color: transparent;
				background: transparent;
				cursor: default;
				min-width: 0;
				padding: 0;

				&:hover {
					background: transparent;
					color: inherit;
				}
			}

			&[type="delegate-to-cloud-agent"] {
				.filename {
					font-weight: 500;
					display: flex;
					align-items: center;
					gap: 8px;

					svg {
						color: var(--vscode-foreground-secondary);
					}
				}
			}

			.filename {
				font-size: 13px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				width: max-content;
				letter-spacing: 0.01em;
			}

			.close-icon {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 16px;
				height: 16px;
				cursor: pointer;
				border-radius: var(--radius-sm);
				transition: background-color var(--transition-fast);

				&:hover {
					background: rgba(255, 255, 255, 0.1);
				}

				svg {
					width: 14px;
					height: 14px;
					fill: var(--vscode-foreground-secondary);
					opacity: 0;
					transition: opacity var(--transition-fast);
					pointer-events: none;
				}
			}
		}

		tab-action {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 6px;
			border-radius: var(--radius-sm);
			color: var(--vscode-foreground-secondary);
			cursor: pointer;
			flex-shrink: 0;
			transition: all var(--transition-fast);

			&:hover {
				background: var(--vscode-icon-button-hover-bg);
				color: var(--vscode-foreground);
			}

			svg {
				width: 14px;
				height: 14px;
			}
		}
	}
</style>
