<style>
	terminal-panel {
		display: flex;
		flex-direction: column;
		background: var(--vscode-bg);
		border-top: solid 1px var(--vscode-border);
		height: 180px;
		min-height: 100px;
		max-height: 60vh;
		flex: 0 0 auto;
		position: relative;

		/* Resize handle at the top */
		&::before {
			content: "";
			position: absolute;
			top: -3px;
			left: 0;
			width: 100%;
			height: 4px;
			cursor: ns-resize;
			z-index: 10;
			background-color: transparent;
			transition: background-color 0.15s ease;
		}

		&.resize-hover::before,
		&.resizing::before {
			background-color: var(--vscode-accent);
		}

		&.resizing {
			user-select: none;
		}

		panel-tab-bar {
			display: flex;
			justify-content: flex-start;
			align-items: center;
			padding: 0 8px;
			gap: 0;
			height: 35px;
			border-bottom: solid 1px var(--vscode-border);
			width: 100%;
			min-width: 0;
			flex: 0 0 auto;
			user-select: none;

			panel-tab {
				display: flex;
				align-items: center;
				padding: 6px 10px;
				color: var(--vscode-foreground-secondary);
				cursor: pointer;
				height: 100%;
				border-bottom: 1px solid transparent;
				margin-bottom: -1px;

				&:hover {
					color: var(--vscode-foreground);
				}

				&[active] {
					color: var(--vscode-foreground);
					border-bottom-color: var(--vscode-foreground);
				}

				&[type="fill-end"] {
					flex: 1 1 auto;
					border-color: transparent;
					cursor: default;
					min-width: 0;
					padding: 0;
				}

				.tab-name {
					font-size: 11px;
					font-weight: 400;
					text-transform: uppercase;
					letter-spacing: 0.02em;
					white-space: nowrap;
				}
			}

			panel-actions {
				display: flex;
				align-items: center;
				gap: 2px;

				action-icon {
					display: flex;
					justify-content: center;
					align-items: center;
					padding: 4px;
					border-radius: 4px;
					color: var(--vscode-foreground-secondary);
					cursor: pointer;

					&:hover {
						background: var(--vscode-icon-button-hover-bg);
						color: var(--vscode-foreground);
					}

					svg {
						width: 16px;
						height: 16px;
					}
				}
			}
		}

		terminal-content {
			display: flex;
			flex-direction: column;
			padding: 8px 12px;
			font-family: "SF Mono", Monaco, "Cascadia Code", "Segoe UI Mono", "Roboto Mono", "Oxygen Mono", "Ubuntu Mono", "Source Code Pro", "Fira Mono", "Droid Sans Mono", "Courier New", monospace;
			font-size: 13px;
			line-height: 1.4;
			overflow: auto;
			flex: 1 1 auto;
			min-height: 0;
			background: var(--vscode-editor-bg);

			terminal-line {
				display: flex;
				align-items: center;
				gap: 8px;
				color: var(--vscode-foreground);
				white-space: nowrap;

				.prompt {
					color: var(--vscode-accent);
				}

				.command {
					color: var(--vscode-foreground);
				}

				.cursor {
					color: var(--vscode-foreground);
					animation: blink 1s step-end infinite;
				}

				&[type="output"] {
					color: var(--vscode-foreground-secondary);
					padding-left: 0;
				}
			}
		}
	}

	@keyframes blink {
		0%, 100% {
			opacity: 1;
		}
		50% {
			opacity: 0;
		}
	}
</style>
