<style>
	status-bar {
		display: flex;
		justify-content: space-between;
		align-items: center;
		padding: 2px 4px;
		background: var(--vscode-bg);
		color: var(--vscode-foreground-secondary);
		border: solid 1px var(--vscode-border);
		border-radius: var(--radius-md);
		user-select: none;
		font-size: 11px;
		font-weight: 500;
		letter-spacing: 0.02em;
		flex: 0 0 auto;

		.status-bar-left,
		.status-bar-center,
		.status-bar-right {
			display: flex;
			align-items: center;
			gap: 2px;
		}

		.status-bar-left,
		.status-bar-right {
			flex: 1;
		}

		.status-bar-right {
			justify-content: flex-end;
		}

		.status-bar-center {
			flex: 0 0 auto;
		}

		status-item {
			display: flex;
			align-items: center;
			gap: 5px;
			padding: 4px 10px;
			height: 100%;
			cursor: pointer;
			border-radius: var(--radius-sm);
			transition: all var(--transition-fast);

			&:hover {
				background: var(--vscode-icon-button-hover-bg);
				color: var(--vscode-foreground);
			}

			svg {
				width: 14px;
				height: 14px;
				opacity: 0.8;
			}

			&:hover svg {
				opacity: 1;
			}
		}

		sessions-indicator {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 4px 12px;
			cursor: pointer;
			border-radius: var(--radius-sm);
			transition: all var(--transition-fast);
			color: var(--vscode-foreground-secondary);

			&:hover {
				background: var(--vscode-icon-button-hover-bg);
				color: var(--vscode-foreground);
			}

			svg {
				width: 14px;
				height: 14px;
				opacity: 0.8;
			}

			.chevron {
				width: 10px;
				height: 10px;
				transition: transform var(--transition-fast);
			}

			&:hover svg {
				opacity: 1;
			}

			&[expanded] .chevron {
				transform: rotate(180deg);
			}

			.session-count {
				font-size: 11px;
			}
		}
	}
</style>
