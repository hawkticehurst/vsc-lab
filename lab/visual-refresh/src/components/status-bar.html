<style>
	status-bar {
		display: flex;
		justify-content: space-between;
		align-items: center;
		padding: 2px 4px;
		background: linear-gradient(to top, rgba(0, 0, 0, 0.15), transparent);
		color: var(--vscode-foreground-secondary);
		border-top: solid 1px var(--vscode-border);
		border-bottom-left-radius: var(--radius-lg);
		border-bottom-right-radius: var(--radius-lg);
		user-select: none;
		font-size: 11px;
		font-weight: 500;
		letter-spacing: 0.02em;
		flex: 0 0 auto;

		.status-bar-left,
		.status-bar-right {
			display: flex;
			align-items: center;
			gap: 2px;
		}

		status-item {
			display: flex;
			align-items: center;
			gap: 5px;
			padding: 4px 10px;
			height: 100%;
			cursor: pointer;
			border-radius: var(--radius-sm);
			transition: all var(--transition-fast);

			&:hover {
				background: var(--vscode-icon-button-hover-bg);
				color: var(--vscode-foreground);
			}

			svg {
				width: 14px;
				height: 14px;
				opacity: 0.8;
			}

			&:hover svg {
				opacity: 1;
			}
		}
	}
</style>
