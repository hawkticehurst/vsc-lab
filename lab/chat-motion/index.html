<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chat Motion Prototype</title>
	<link rel="stylesheet" href="main.css">
</head>
<body>
	<div class="animation-controls">
		<h3>Animation Style</h3>
		<div class="animation-buttons">
			<button class="animation-toggle active" data-animation="fade">Fade</button>
			<button class="animation-toggle" data-animation="rise">Rise</button>
			<button class="animation-toggle" data-animation="drop">Drop</button>
			<button class="animation-toggle" data-animation="blur">Blur</button>
			<button class="animation-toggle" data-animation="scale">Scale</button>
			<button class="animation-toggle" data-animation="slide">Slide</button>
			<button class="animation-toggle" data-animation="expand">Expand</button>
			<button class="animation-toggle" data-animation="reveal">Reveal</button>
			<button class="animation-toggle" data-animation="unfold">Unfold</button>
			<button class="animation-toggle" data-animation="drift">Drift</button>
			<button class="animation-toggle" data-animation="line">Line</button>
			<button class="animation-toggle" data-animation="line-rise">Line Rise</button>
			<button class="animation-toggle" data-animation="line-slide">Line Slide</button>
			<button class="animation-toggle" data-animation="line-blur">Line Blur</button>
			<button class="animation-toggle" data-animation="line-scale">Line Scale</button>
			<button class="animation-toggle" data-animation="line-expand">Line Expand</button>
			<button class="animation-toggle" data-animation="line-reveal">Line Reveal</button>
		</div>
	</div>
	
	<div class="chat-container">
		<div class="animation-description" id="animationDescription">
			<div class="animation-description-title">
				<span id="animationName">Fade In</span>
			</div>
			<p class="animation-description-text" id="animationText">Simple opacity fade from 0 to 1. Clean and minimal baseline animation.</p>
		</div>
		
		<header class="chat-header">
			<h1 class="header-title">Chat</h1>
		</header>

		<main class="chat-content" id="chatContent">
			<!-- User message -->
			<div class="chat-item">
				<div class="chat-message">
					<div class="chat-meta">
						<p class="chat-details">Can you help me create a React component for a todo list?</p>
					</div>
				</div>
			</div>
			
			<!-- AI Response - will be animated -->
			<div class="chat-item ai-response" id="aiResponse">
				<div class="chat-response">
					<div class="chat-meta" id="animatedContent">
						<!-- Content will be injected here based on animation type -->
					</div>
				</div>
				<div class="feedback-buttons">
					<button class="feedback-button">
						<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
							<path d="M12.959 6H9.526L9.99 3.68C10.122 3.019 9.953 2.342 9.526 1.82C9.099 1.299 8.467 1 7.794 1C7.35 1 6.955 1.298 6.843 1.693L6.379 2.979C5.861 4.415 5.145 5.766 4.248 7H2.5C1.673 7 1 7.673 1 8.5V13.5C1 14.327 1.673 15 2.5 15H11.397C12.277 15 13.044 14.436 13.306 13.596L14.868 8.596C15.06 7.982 14.951 7.333 14.571 6.815C14.191 6.297 13.602 6 12.959 6ZM2 13.5V8.5C2 8.224 2.224 8 2.5 8H4V14H2.5C2.224 14 2 13.776 2 13.5ZM13.915 8.298L12.353 13.298C12.222 13.717 11.838 14 11.398 14H5.001V7.664C5.979 6.333 6.759 4.872 7.32 3.319L7.795 2.001C8.168 2.001 8.518 2.167 8.754 2.455C8.991 2.744 9.085 3.119 9.011 3.484L8.428 6.402C8.399 6.549 8.437 6.701 8.532 6.817C8.627 6.933 8.769 7 8.919 7H12.962C13.284 7 13.578 7.148 13.768 7.408C13.958 7.668 14.013 7.991 13.917 8.299L13.915 8.298Z"/>
						</svg>
					</button>
					<button class="feedback-button">
						<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
							<path d="M13.4999 1H4.60292C3.72392 1 2.95692 1.564 2.69392 2.404L1.13192 7.404C0.940924 8.018 1.04892 8.667 1.42992 9.185C1.81092 9.703 2.39892 10 3.04092 10H6.47492L6.01092 12.32C5.87792 12.98 6.04792 13.658 6.47492 14.179C6.90192 14.7 7.53392 14.999 8.20692 14.999C8.65092 14.999 9.04692 14.701 9.15892 14.306L9.62292 13.02C10.1409 11.585 10.8559 10.234 11.7539 8.999H13.5009C14.3279 8.999 15.0009 8.326 15.0009 7.499V2.5C15.0009 1.673 14.3269 1 13.4999 1ZM8.68092 12.682L8.20592 14C7.83292 14 7.48292 13.834 7.24692 13.546C7.01092 13.258 6.91692 12.882 6.98992 12.517L7.57392 9.599C7.60292 9.452 7.56492 9.3 7.46992 9.184C7.37492 9.068 7.23292 9.001 7.08292 9.001H3.03892C2.71792 9.001 2.42392 8.853 2.23292 8.593C2.04292 8.334 1.98892 8.01 2.08492 7.702L3.64692 2.702C3.77792 2.282 4.16192 2 4.60092 2H10.9979V8.336C10.0199 9.668 9.23992 11.13 8.67892 12.682H8.68092ZM13.9999 7.5C13.9999 7.776 13.7749 8 13.4999 8H11.9999V2H13.4999C13.7749 2 13.9999 2.224 13.9999 2.5V7.5Z"/>
						</svg>
					</button>
				</div>
			</div>
		</main>
		
		<div class="command-input-container">
			<div class="command-input-wrapper">
				<button class="context-button">
					<svg
						width="16"
						height="16"
						viewBox="0 0 16 16"
						xmlns="http://www.w3.org/2000/svg"
						fill="currentColor"
					>

							d="M2.2832 7.97549C2.2832 8.25149 2.5072 8.47549 2.7832 8.47549C2.9112 8.47549 3.0392 8.42649 3.1372 8.32949L7.7322 3.73249C8.2202 3.24449 8.8602 3.00049 9.5002 3.00049C10.8812 3.00049 12.0002 4.11949 12.0002 5.50049C12.0002 6.14049 11.7562 6.78049 11.2682 7.26849L5.9652 12.5715C5.7702 12.7665 5.5142 12.8645 5.2582 12.8645C4.7062 12.8645 4.2582 12.4165 4.2582 11.8645C4.2582 11.6085 4.3562 11.3525 4.5512 11.1575L9.8542 5.85449C9.9522 5.75649 10.0002 5.62849 10.0002 5.50049C10.0002 5.22449 9.7762 5.00049 9.5002 5.00049C9.3722 5.00049 9.2442 5.04949 9.1462 5.14649L3.8432 10.4505C3.4522 10.8415 3.2572 11.3525 3.2572 11.8645C3.2572 12.9695 4.1522 13.8645 5.2572 13.8645C5.7692 13.8645 6.2812 13.6695 6.6712 13.2785L11.9742 7.97549C12.6572 7.29249 12.9992 6.39649 12.9992 5.50049C12.9992 3.56749 11.4322 2.00049 9.4992 2.00049C8.6032 2.00049 7.7082 2.34249 7.0242 3.02549L2.4292 7.62149C2.3312 7.71949 2.2832 7.84749 2.2832 7.97549Z"
						/>
					</svg>
				</button>
				<input type="text" class="command-input" placeholder="Describe what to build next">
				<div class="command-actions">
					<div class="command-buttons">
						<button class="command-button">
							Agent
							<svg
								width="16"
								height="16"
								viewBox="0 0 16 16"
								xmlns="http://www.w3.org/2000/svg"
								fill="currentColor"
							>
								<path
									d="M3.14645 5.64645C3.34171 5.45118 3.65829 5.45118 3.85355 5.64645L8 9.79289L12.1464 5.64645C12.3417 5.45118 12.6583 5.45118 12.8536 5.64645C13.0488 5.84171 13.0488 6.15829 12.8536 6.35355L8.35355 10.8536C8.15829 11.0488 7.84171 11.0488 7.64645 10.8536L3.14645 6.35355C2.95118 6.15829 2.95118 5.84171 3.14645 5.64645Z"
								/>
							</svg>
						</button>
						<button class="command-button">
							Claude Opus 4.4
							<svg
								width="16"
								height="16"
								viewBox="0 0 16 16"
								xmlns="http://www.w3.org/2000/svg"
								fill="currentColor"
							>
								<path
									d="M3.14645 5.64645C3.34171 5.45118 3.65829 5.45118 3.85355 5.64645L8 9.79289L12.1464 5.64645C12.3417 5.45118 12.6583 5.45118 12.8536 5.64645C13.0488 5.84171 13.0488 6.15829 12.8536 6.35355L8.35355 10.8536C8.15829 11.0488 7.84171 11.0488 7.64645 10.8536L3.14645 6.35355C2.95118 6.15829 2.95118 5.84171 3.14645 5.64645Z"
								/>
							</svg>
						</button>
						<svg
							width="18"
							height="18"
							viewBox="0 0 18 18"
							xmlns="http://www.w3.org/2000/svg"
							fill="currentColor"
						>
							<path
								d="M6.66901 2C6.52101 1.946 6.34701 1.969 6.21401 2.062C6.08101 2.155 6.00201 2.308 6.00201 2.47V4.286C6.00201 4.561 5.77701 4.786 5.50201 4.786C5.22701 4.786 5.00201 4.561 5.00201 4.286V2.47C5.00201 2.308 4.92301 2.156 4.79001 2.062C4.65801 1.968 4.48501 1.946 4.33501 2C2.93901 2.495 2.00201 3.816 2.00201 5.287C2.00201 6.646 2.79201 7.876 4.00201 8.449V14.5C4.00201 15.327 4.67501 16 5.50201 16C6.32901 16 7.00201 15.327 7.00201 14.5V8.449C8.21201 7.876 9.00201 6.646 9.00201 5.287C9.00201 3.816 8.06401 2.495 6.66901 2ZM6.33601 7.644C6.13601 7.714 6.00201 7.904 6.00201 8.116V14.501C6.00201 14.776 5.77701 15.001 5.50201 15.001C5.22701 15.001 5.00201 14.776 5.00201 14.501V8.116C5.00201 7.904 4.86801 7.715 4.66801 7.644C3.67201 7.292 3.00201 6.345 3.00201 5.288C3.00201 4.496 3.38501 3.765 4.00201 3.301V4.288C4.00201 5.115 4.67501 5.788 5.50201 5.788C6.32901 5.788 7.00201 5.115 7.00201 4.288V3.301C7.61901 3.765 8.00201 4.496 8.00201 5.288C8.00201 6.346 7.33201 7.293 6.33601 7.644ZM14.5 9H14.002V5.118L14.449 4.223C14.509 4.105 14.518 3.967 14.476 3.841L13.976 2.341C13.908 2.137 13.716 1.999 13.501 1.999H11.501C11.286 1.999 11.095 2.137 11.026 2.341L10.526 3.841C10.484 3.967 10.494 4.105 10.553 4.223L11 5.118V9H10.5C10.224 9 10 9.224 10 9.5V13.5C10 14.879 11.121 16 12.5 16C13.879 16 15 14.879 15 13.5V9.5C15 9.224 14.776 9 14.5 9ZM11.862 3.001H13.141L13.461 3.963L13.054 4.777C13.02 4.846 13.001 4.923 13.001 5.001V9.001H12.001V5.001C12.001 4.924 11.983 4.847 11.949 4.777L11.542 3.963L11.862 3.001ZM14.002 13.5C14.002 14.327 13.329 15 12.502 15C11.675 15 11.002 14.327 11.002 13.5V10H14.002V13.5Z"
							/>
						</svg>
					</div>
					<button class="command-button send-button">
						<svg
							width="16"
							height="16"
							viewBox="0 0 16 16"
							xmlns="http://www.w3.org/2000/svg"
							fill="currentColor"
						>
							<path
								d="M1.17683 1.11898C1.32953 0.989634 1.54464 0.963786 1.72363 1.05328L14.7236 7.55328C14.893 7.63797 15 7.8111 15 8.00049C15 8.18987 14.893 8.36301 14.7236 8.4477L1.72363 14.9477C1.54464 15.0372 1.32953 15.0113 1.17683 14.882C1.02414 14.7526 0.96328 14.5447 1.02213 14.3534L2.97688 8.00049L1.02213 1.64754C0.96328 1.45627 1.02414 1.24833 1.17683 1.11898ZM3.8693 8.50049L2.32155 13.5307L13.382 8.00049L2.32155 2.47027L3.8693 7.50049H9.50001C9.77615 7.50049 10 7.72435 10 8.00049C10 8.27663 9.77615 8.50049 9.50001 8.50049H3.8693Z"
							/>
						</svg>
					</button>
				</div>
			</div>
		</div>
	</div>

	<button class="restart-button" id="restartBtn">
		<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
			<path fill-rule="evenodd" clip-rule="evenodd" d="M4.681 3H2V2h3.5l.5.5V6H5V4a5 5 0 1 0 4.53-.761l.302-.954A6 6 0 1 1 4.681 3z"/>
		</svg>
		Restart Animation
	</button>

	<script src="main.js"></script>
</body>
</html>
